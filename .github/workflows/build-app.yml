name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: cd app && npm ci

      # Delegates to the script so the sidecar list lives in exactly one place.
      - name: Build sidecars
        run: bash app/build-sidecar.sh --universal-darwin

      # Ship the CLI as a standalone binary too. Same bun --compile the sidecars use, but
      # pointed at cli.ts, so a team member can download one file and run it — no Node, no
      # npm, no Nix. ffmpeg is fetched on first run, so the binary is self-sufficient.
      - name: Build CLI binaries
        run: |
          mkdir -p dist-cli
          for tool in video-edit; do
            bun build --compile --target=bun-darwin-arm64 \
              tools/$tool/cli.ts --outfile dist-cli/$tool-aarch64-apple-darwin
            bun build --compile --target=bun-darwin-x64 \
              tools/$tool/cli.ts --outfile dist-cli/$tool-x86_64-apple-darwin
            lipo -create \
              dist-cli/$tool-aarch64-apple-darwin \
              dist-cli/$tool-x86_64-apple-darwin \
              -output dist-cli/$tool
            rm dist-cli/$tool-aarch64-apple-darwin dist-cli/$tool-x86_64-apple-darwin
          done
          ls -lh dist-cli

      # The tag is the single source of truth for the release version. Without
      # this, every build ships as the checked-in placeholder — v2026.4.1 and
      # v2026.8.1 both produced "Schema Labs Toolkit_0.1.0_universal.dmg", so a
      # user could not tell which release they had installed, in the .dmg
      # filename or in Get Info. A bumped-by-hand field drifts; a stamped one
      # cannot. Manual dispatch builds keep the checked-in dev version.
      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CONF=app/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' "$CONF" > "$CONF.tmp"
          mv "$CONF.tmp" "$CONF"
          echo "Bundle version: $(jq -r '.version' "$CONF")"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: 'Schema Labs Toolkit ${{ github.ref_name }}'
          releaseBody: |
            Download the .dmg for the desktop app.

            `video-edit` is the command line tool. Download it, then:
            `chmod +x video-edit && xattr -c video-edit && mv video-edit /usr/local/bin/`
          releaseDraft: true

      # Uploaded separately: tauri-action only publishes what it builds itself.
      - name: Attach CLI binaries to the release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist-cli/* --clobber
